name: build

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      # rustfmt.toml uses nightly-only options (imports_layout, group_imports).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all --check

      - name: version
        run: sh ci/verify-version.sh

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: ./.github/actions/setup
        with:
          cache-key: clippy

      - name: clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -A clippy::not_unsafe_ptr_arg_deref -A clippy::missing_panics_doc -A unused_unsafe -A unsafe_code

      - name: clippy (privacy-hard-blocking)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -A clippy::not_unsafe_ptr_arg_deref -A clippy::missing_panics_doc -A unused_unsafe -A unsafe_code

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: ./.github/actions/setup
        with:
          cache-key: test

      - name: test (default features)
        run: cargo test --locked --workspace --all-targets

      - name: test (privacy-hard-blocking)
        run: cargo test --locked --workspace --all-targets --all-features

      - name: build release
        run: cargo build --locked --release

      - uses: actions/upload-artifact@v7
        with:
          name: libspotifyadblock.so
          path: target/release/libspotifyadblock.so
