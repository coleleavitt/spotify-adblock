name: build

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: ./.github/actions/setup

      - name: Verify version
        run: sh ci/verify-version.sh

      - name: Clippy
        run: cargo clippy --locked --all-features -- -A clippy::not_unsafe_ptr_arg_deref -A clippy::missing_panics_doc -A unused_unsafe -A unsafe_code -D warnings

      - name: Test (default features)
        run: cargo test --locked --workspace

      - name: Test (privacy-hard-blocking)
        run: cargo test --locked --workspace --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - uses: actions/upload-artifact@v7
        with:
          name: libspotifyadblock.so
          path: target/release/libspotifyadblock.so
